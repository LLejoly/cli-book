const taleSlug = n => `tale-${n}`;
const isTale = slug => /^tale-\d+$/.test(slug || "");
const TALE_OF = slug => BOOK.chapters.find(ch => taleSlug(ch.number) === slug);
const chapterOf = slug => isTale(slug) ? TALE_OF(slug).number : BY_SLUG[slug] ? BY_SLUG[slug].chapter.number : null;
const isLeaf = slug => slug === "title" || slug === "plan" || slug === "summary" || (isTale(slug) && !!TALE_OF(slug)) || !!BY_SLUG[slug];
// Turning pages walks the tale of each chapter, then its pages.
const neighbours = slug => { const i = SEQ.indexOf(slug); return [SEQ[i - 1], SEQ[i + 1]]; };
const leafTitle = slug => slug === "title" ? t("title_page") : slug === "plan" ? t("plan_title") : isTale(slug) ? TALE_OF(slug).tale.title : BY_SLUG[slug].title;

// Per-reader progress: the ribbon bookmark and the stamps earned.
const store = {
  read() { try { return JSON.parse(localStorage.getItem("leather-book") || "{}"); } catch { return {}; } },
  write(v) { try { localStorage.setItem("leather-book", JSON.stringify(v)); } catch {} },
};
const state = Object.assign({ bookmark: null, stamps: [], toggled: {}, view: null, sumRisk: "all", sumQuery: "", lang: null, reader: "", sound: false }, store.read());
const save = () => store.write({ bookmark: state.bookmark, stamps: state.stamps, toggled: state.toggled, lang: state.lang, reader: state.reader, sound: state.sound });
const reducedMotion = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Stamps and the bookmark are kept per page, so they carry over between languages.

// ---------- The sounds of the house ----------
// Everything is synthesised with the Web Audio API, so the page needs no sound files.
// Sound starts off; the reader turns it on with the gramophone button, and the choice is remembered.
const Sound = (() => {
  let ctx = null, master = null, noise = null, ambient = null, tickTimer = null, crackleTimer = null, lastChime = null;
  const on = () => state.sound && ctx;
  function init() {
    if (ctx) return ctx.resume();
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = .7; master.connect(ctx.destination);
    noise = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = noise.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  // A burst of filtered noise: paper, straw, wood.
  function hiss({ at = 0, dur = .3, type = "bandpass", f1 = 1500, f2 = f1, q = 1, gain = .3, attack = .02 }) {
    const t0 = ctx.currentTime + at, src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise; src.loop = true;
    flt.type = type; flt.Q.value = q; flt.frequency.setValueAtTime(f1, t0); flt.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + attack); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    src.connect(flt).connect(g).connect(master); src.start(t0, Math.random()); src.stop(t0 + dur + .05);
  }
  // A pitched tone that falls away: wood knocks, wax thuds, bells.
  function tone({ at = 0, f = 220, f2 = f, dur = .3, gain = .3, type = "sine" }) {
    const t0 = ctx.currentTime + at, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(gain, t0); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
    o.connect(g).connect(master); o.start(t0); o.stop(t0 + dur + .05);
  }
  const bell = (at, f, gain = .18, dur = 2.6) => [[1, 1], [2.76, .45], [5.4, .22], [8.9, .1]]
    .forEach(([m, k]) => tone({ at, f: f * m, dur: dur / Math.sqrt(m), gain: gain * k }));
  const SFX = {
    turn() { hiss({ dur: .38, f1: 700, f2: 3200, q: .8, gain: .28, attack: .06 }); hiss({ at: .2, dur: .18, type: "lowpass", f1: 900, f2: 300, gain: .18 }); },
    slide() { hiss({ dur: .32, type: "lowpass", f1: 1800, f2: 700, gain: .16, attack: .08 }); },
    drawer() { hiss({ dur: .45, type: "bandpass", f1: 300, f2: 500, q: 2, gain: .22, attack: .1 }); tone({ at: .42, f: 160, f2: 90, dur: .12, gain: .25 }); },
    scratch() { for (let i = 0; i < 9; i++) hiss({ at: i * .055 + Math.random() * .02, dur: .05, type: "highpass", f1: 3500 + Math.random() * 2500, gain: .07 + Math.random() * .05, attack: .005 }); },
    thud() { tone({ f: 110, f2: 45, dur: .28, gain: .55 }); hiss({ dur: .08, type: "lowpass", f1: 1200, f2: 300, gain: .25, attack: .003 }); },
    knock() { [0, .22].forEach(at => { tone({ at, f: 190, f2: 120, dur: .12, gain: .45, type: "triangle" }); hiss({ at, dur: .05, type: "lowpass", f1: 2000, f2: 500, gain: .2, attack: .002 }); }); },
    creak() { const t0 = ctx.currentTime, o = ctx.createOscillator(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(70, t0); o.frequency.linearRampToValueAtTime(110, t0 + .25); o.frequency.linearRampToValueAtTime(80, t0 + .55);
      flt.type = "bandpass"; flt.frequency.value = 900; flt.Q.value = 6;
      g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(.12, t0 + .08); g.gain.exponentialRampToValueAtTime(.0001, t0 + .6);
      o.connect(flt).connect(g).connect(master); o.start(t0); o.stop(t0 + .65);
      hiss({ at: .45, dur: .4, f1: 600, f2: 2400, gain: .2, attack: .05 }); },
    tock() { tone({ f: 140, f2: 110, dur: .16, gain: .3, type: "triangle" }); },
    ding() { bell(0, 1320, .09, 1.2); },
    chime() { [523.25, 659.25, 783.99].forEach((f, i) => bell(i * .32, f, .1, 2)); },
    tick() { hiss({ dur: .018, type: "bandpass", f1: 4200, q: 8, gain: .05, attack: .001 }); },
  };
  function play(name) { if (on() && SFX[name]) { try { SFX[name](); } catch {} } }
  // The room: a low hiss of gaslight, an odd crackle from the grate, and the watch ticking on the landing.
  function startAmbient() {
    if (!on() || ambient) return;
    const src = ctx.createBufferSource(), flt = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise; src.loop = true; flt.type = "lowpass"; flt.frequency.value = 380; g.gain.value = .035;
    src.connect(flt).connect(g).connect(master); src.start(); ambient = src;
    const crackle = () => { if (!ambient) return; if (Math.random() < .7) hiss({ dur: .02 + Math.random() * .04, type: "highpass", f1: 1500 + Math.random() * 3000, gain: .02 + Math.random() * .04, attack: .002 });
      crackleTimer = setTimeout(crackle, 300 + Math.random() * 2200); };
    crackle();
    tickTimer = setInterval(() => { if (!$("landing").hidden && !document.hidden) SFX.tick(); }, 1000);
  }
  function stopAmbient() {
    if (ambient) { try { ambient.stop(); } catch {} ambient = null; }
    clearTimeout(crackleTimer); clearInterval(tickTimer);
  }
  // The house clock strikes the hour, the real one, while the book is open in front of you.
  function strike(now) {
    if (!on() || now.getMinutes() !== 0 || lastChime === now.getHours()) return;
    lastChime = now.getHours();
    const n = now.getHours() % 12 || 12;
    for (let i = 0; i < n; i++) bell(i * 1.7, 196, .16, 3);
  }
  function setOn(v) {
    state.sound = v; save();
    document.querySelectorAll("[data-sound]").forEach(b => { b.setAttribute("aria-pressed", String(v)); b.setAttribute("aria-label", t(v ? "sound_off" : "sound_on")); });
    if (v) { init(); startAmbient(); play("chime"); } else stopAmbient();
  }
  // Browsers only let sound start after a click or a key, so a remembered "on" waits for the first one.
  function sync() {
    document.querySelectorAll("[data-sound]").forEach(b => { b.setAttribute("aria-pressed", String(state.sound)); b.setAttribute("aria-label", t(state.sound ? "sound_off" : "sound_on")); });
    if (!state.sound || ctx) return;
    const wake = e => { if (e.target.closest && e.target.closest("[data-sound]")) return; removeEventListener("pointerdown", wake, true); removeEventListener("keydown", wake, true); if (state.sound) { init(); startAmbient(); } };
    addEventListener("pointerdown", wake, true); addEventListener("keydown", wake, true);
  }
  return { play, setOn, strike, sync, toggle: () => setOn(!state.sound) };
})();

// Small live details: the pocket watch keeps the reader's own time, Aunt Ada's
// letter is dated today, and the gaslight follows the hour.
function liveDetails() {
  const now = new Date(), secs = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
  const periods = { h: 43200, m: 3600, "": 60 };
  document.querySelectorAll(".watch-hand").forEach(el => {
    const kind = el.classList.contains("h") ? "h" : el.classList.contains("m") ? "m" : "";
    el.style.animationDelay = `-${secs % periods[kind]}s`;
  });
  const h = now.getHours();
  Sound.strike(now);
  document.documentElement.dataset.daypart = h >= 7 && h < 18 ? "day" : h >= 18 && h < 21 ? "evening" : "night";
  const date = $("letter-date");
  if (date) try { date.textContent = now.toLocaleDateString(state.lang === "fr" ? "fr-FR" : "en-GB", { weekday: "long", day: "numeric", month: "long" }); } catch {}
}

function useLang(code) {
  if (!DATA.books[code]) code = "en";
  state.lang = code;
  BOOK = DATA.books[code]; T = BOOK.ui;
  SEALS = Object.fromEntries(["low", "medium", "high"].map(r => [r, { name: t("seal_" + r), note: t("seal_note_" + r) }]));
  ORDER = [];
  BOOK.chapters.forEach(ch => ch.pages.forEach(p => { if (!p.missing) ORDER.push({ ...p, chapter: ch }); }));
  BY_SLUG = Object.fromEntries(ORDER.map((p, i) => [p.slug, { ...p, index: i }]));
  SLUG_OF = Object.fromEntries(ORDER.map(p => [p.command, p.slug]));
  SEQ = ["title", "plan", ...BOOK.chapters.flatMap(ch => [...(ch.tale ? [taleSlug(ch.number)] : []), ...ch.pages.filter(p => !p.missing).map(p => p.slug)])];
  document.documentElement.lang = code;
  $("app").lang = code;
  document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
  document.querySelectorAll("[data-t-aria]").forEach(el => el.setAttribute("aria-label", t(el.dataset.tAria)));
  document.querySelectorAll("[data-t-ph]").forEach(el => el.setAttribute("placeholder", t(el.dataset.tPh)));
  document.querySelectorAll("[data-t-title]").forEach(el => el.setAttribute("title", t(el.dataset.tTitle)));
  document.querySelectorAll(".langs").forEach(box => {
    box.innerHTML = DATA.languages.map(c => `<button type="button" data-lang="${c}" lang="${c}" aria-pressed="${c === code}">${esc(DATA.books[c].name)}</button>`).join("");
  });
}

function pickLang() {
  if (state.lang && DATA.books[state.lang]) return state.lang;
  const wanted = (navigator.languages || [navigator.language || "en"]).map(l => l.slice(0, 2).toLowerCase());
  return wanted.find(l => DATA.books[l]) || "en";
}

function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2600);
}

function renderCover() {
  const lantern = ORDER.find(p => p.slug === "ls");
  // Own pattern ids, so the plate's hatching doesn't depend on the hidden cover.
  if (lantern && lantern.sketch) $("emblem").innerHTML = ownIds(lantern.sketch, "cover-");
  const n = state.stamps.filter(s => BY_SLUG[s]).length;
  $("cover-stamps").textContent = n ? t("stamps_earned", { n, total: ORDER.length }) : t("stamps_to_earn", { total: ORDER.length });
  const bm = state.bookmark && SEQ.includes(state.bookmark) && state.bookmark;
  $("continue").hidden = !bm;
  if (bm) $("continue").textContent = t("continue_at", { title: leafTitle(bm) });
  renderLanding();
  updateDock();
}

let unfolding = null;
function renderTree(current) {
  const total = ORDER.length;
  const earned = state.stamps.filter(s => BY_SLUG[s]).length;
  $("tally").innerHTML = t("tally", { n: earned, total });
  $("tree").innerHTML = BOOK.chapters.map(ch => {
    const written = ch.pages.filter(p => !p.missing);
    const sealed = written.length && written.every(p => state.stamps.includes(p.slug));
    // A chapter starts unfolded when the open page is in it; after that the reader decides.
    const toggled = state.toggled[ch.number];
    const isOpen = toggled === undefined ? (ch.pages.some(p => p.slug === current) || taleSlug(ch.number) === current) : toggled;
    const sealSvg = sealed
      ? '<svg class="chapter-seal" viewBox="0 0 26 26" aria-label="' + esc(t("chapter_sealed")) + '"><circle cx="13" cy="13" r="11" fill="var(--wax-high)"/><circle cx="13" cy="13" r="7.5" fill="none" stroke="#f6e7d0" stroke-width=".8"/><text x="13" y="16.5" text-anchor="middle" font-size="9" fill="#f6e7d0" font-family="serif">' + ROMAN[ch.number] + '</text></svg>'
      : "";
    return `<div class="chapter">
      <button class="chapter-btn" type="button" aria-expanded="${isOpen}" data-ch="${ch.number}">
        <span class="num">${t("ch_short")} ${ROMAN[ch.number] || ch.number}</span>
        <span class="chapter-title">${esc(ch.title)}</span>${sealSvg}
        <span class="chev" aria-hidden="true">&#9662;</span>
      </button>
      <ol class="tree${unfolding === ch.number ? " unfolding" : ""}" ${isOpen ? "" : "hidden"}>
        ${ch.tale ? `<li style="--k:0"><button class="entry tale-entry" type="button" data-go="${taleSlug(ch.number)}" ${taleSlug(ch.number) === current ? 'aria-current="page"' : ""}>
              <span class="tale-mark" aria-hidden="true">&#10086;</span><span class="entry-title">${esc(ch.tale.title)}</span></button></li>` : ""}
        ${ch.pages.map((p, k) => p.missing
          ? `<li><span class="entry missing"><span></span><code>${esc(p.command)}</code><span class="entry-title">${t("missing_page")}</span><span></span></span></li>`
          : `<li style="--k:${k}"><button class="entry ${state.stamps.includes(p.slug) ? "stamped" : ""}" type="button" data-go="${p.slug}" ${p.slug === current ? 'aria-current="page"' : ""}>
              <span class="mini-seal ${p.risk}" title="${SEALS[p.risk].name}"></span>
              <code>${esc(p.command)}</code>
              <span class="entry-title">${esc(p.title)}</span>${TICK}
            </button></li>`).join("")}
      </ol>
    </div>`;
  }).join("");
  if (current === "summary") $("summary-link").setAttribute("aria-current", "page");
  else $("summary-link").removeAttribute("aria-current");
}

const RISK_ORDER = ["low", "medium", "high"];
const plain = html => { const d = document.createElement("div"); d.innerHTML = html || ""; return d.textContent.trim(); };

function renderSummary(animate) {
  const counts = { all: ORDER.length };
  RISK_ORDER.forEach(r => { counts[r] = ORDER.filter(p => p.risk === r).length; });
  const chip = (risk, label) => `<button type="button" data-risk="${risk}" aria-pressed="${state.sumRisk === risk}">${risk === "all" ? "" : `<span class="mini-seal ${risk}"></span>`}${label} <b>${counts[risk]}</b></button>`;
  $("page").innerHTML = `
    <button class="open-contents" id="open-contents" type="button">&#9776; ${t("contents")}</button>
    <div class="running-head"><span>${t("at_a_glance")}</span><span>${t("summary_title")}</span></div>
    <header class="summary-head">
      <h1>${t("summary_title")}</h1>
      <p class="lede">${t("summary_lede")}</p>
    </header>
    <div class="summary-tools">
      <label class="search" for="sum-q">${t("search_label")}
        <input id="sum-q" type="search" autocomplete="off" placeholder="${esc(t("search_placeholder"))}" value="${esc(state.sumQuery)}">
      </label>
      <div class="chips" role="group" aria-label="${esc(t("seal_filter_aria"))}">
        ${chip("all", t("chip_all"))}${chip("low", t("chip_low"))}${chip("medium", t("chip_medium"))}${chip("high", t("chip_high"))}
      </div>
    </div>
    <div class="ledger"><table class="summary">
      <thead><tr><th>${t("col_write")}</th><th>${t("col_object")}</th><th>${t("col_does")}</th><th>${t("col_seal")}</th><th><span class="sr">${t("col_stamped")}</span></th></tr></thead>
      <tbody id="sum-body"></tbody>
    </table></div>
    <p class="sum-count" id="sum-count" aria-live="polite"></p>`;
  fillSummary();
  if (animate) {
    const el = $("page");
    el.classList.remove("turning"); void el.offsetWidth; el.classList.add("turning");
  }
}

function fillSummary() {
  const q = state.sumQuery.trim().toLowerCase();
  let shown = 0, i = 0;
  const body = BOOK.chapters.map(ch => {
    const rows = ch.pages.filter(p => !p.missing).map(p => BY_SLUG[p.slug]).filter(p =>
      (state.sumRisk === "all" || p.risk === state.sumRisk) &&
      (!q || p.command.toLowerCase().includes(q) || p.title.toLowerCase().includes(q) || plain(p.sections["In one line"]).toLowerCase().includes(q)));
    if (!rows.length) return "";
    shown += rows.length;
    return `<tr class="ch-row"><th colspan="5">${t("chapter")} ${ROMAN[ch.number]} · ${esc(ch.title)}</th></tr>` + rows.map(p => `
      <tr class="row" data-row="${p.slug}" style="--i:${i++}">
        <td class="cmd"><button type="button" data-go="${p.slug}">${esc(p.command)}</button></td>
        <td class="obj">${esc(p.title)}</td>
        <td class="does">${esc(plain(p.sections["In one line"]))}</td>
        <td class="seal-cell"><span class="mini-seal ${p.risk}"></span>${SEALS[p.risk].name}</td>
        <td class="stamp-cell">${state.stamps.includes(p.slug) ? TICK.replace('class="tick"', 'class="tick" role="img" aria-label="${esc(t("col_stamped"))}"') : ""}</td>
      </tr>`).join("");
  }).join("");
  $("sum-body").innerHTML = body;
  $("sum-count").textContent = shown === ORDER.length ? t("count_all", { n: shown, chapters: BOOK.chapters.length }) : shown ? t("count_some", { n: shown, total: ORDER.length }) : t("count_none");
}

function renderPage(slug, animate) {
  const p = BY_SLUG[slug];
  if (!p) return;
  const s = p.sections;
  const ex = p.exercise;
  const done = state.stamps.includes(slug);
  const [prevSlug, nextSlug] = neighbours(slug);
  const prev = prevSlug && { slug: prevSlug, title: leafTitle(prevSlug) }, next = nextSlug && { slug: nextSlug, title: leafTitle(nextSlug) };
  const plateNo = p.index + 1;
  const related = p.related.filter(c => SLUG_OF[c]);

  $("page").innerHTML = `
    <button class="open-contents" id="open-contents" type="button">&#9776; ${t("contents")}</button>
    ${p.untranslated && t("untranslated") ? `<p class="untranslated" lang="${state.lang}">${esc(t("untranslated"))}</p>` : ""}
    <div class="running-head"><span>${t("chapter")} ${ROMAN[p.chapter.number]} · ${esc(p.chapter.title)}</span><span>${esc(p.title)}</span></div>
    <header class="page-head">
      <div>
        <h1>${esc(p.title)}</h1>
        <span class="cmd-slip">${esc(p.command)}</span>
      </div>
      <div>
        <div class="seal ${p.risk}" role="img" aria-label="${SEALS[p.risk].name}: ${SEALS[p.risk].note}"><span>${SEALS[p.risk].name}</span></div>
        <div class="seal-note">${SEALS[p.risk].note}</div>
      </div>
    </header>
    <div class="oneline">${s["In one line"] || ""}</div>
    <figure class="plate">
      ${p.sketch || ""}
      <figcaption><b>${t("plate")} ${plateNo}</b><i>${esc(p.metaphor)}</i></figcaption>
    </figure>
    <div class="prose">
      <section class="sec picture"><h3>${esc(BOOK.headings[1])}</h3>${s["The picture"] || ""}</section>
      <section class="sec"><h3>${esc(BOOK.headings[2])} <span class="for">${t("for_practitioner")}</span></h3>${s["What really happens"] || ""}</section>
      <section class="sec"><h3>${esc(BOOK.headings[3])}</h3>${s["Try it"] || ""}</section>
      <section class="sec ledger"><h3>${esc(BOOK.headings[4])}</h3>${s["Margin notes"] || ""}</section>
    </div>
    <aside class="memo prose"><section class="sec" style="margin:0"><h3>${esc(BOOK.headings[5])}</h3>${s["When an agent asks"] || ""}</section></aside>
    <div class="prose">
      <section class="sec careful"><h3>${esc(BOOK.headings[6])}</h3>${s["Careful"] || ""}</section>
    </div>
    <section class="exercise" id="exercise">
      <h3 class="sec-h" style="font-family:var(--f-display);font-weight:400;font-size:var(--step--1);text-transform:uppercase;letter-spacing:.16em;color:var(--sepia);margin:0 0 8px">${t("margin_exercise")}</h3>
      <p class="q">${esc(ex.question)}</p>
      <div class="choices">
        ${ex.choices.map((c, i) => `<button class="choice" type="button" data-i="${i}"><span class="letter">${"abcd"[i]})</span><span>${esc(c)}</span></button>`).join("")}
      </div>
      <p class="verdict" id="verdict" aria-live="polite"></p>
      ${done ? `<div class="stamp">${t("understood")}<br>&#10022;</div>` : ""}
    </section>
    ${related.length ? `<p class="see-also">${t("see_also")} ${related.map(c => `<button type="button" data-go="${SLUG_OF[c]}"><code>${esc(c)}</code>, ${esc(BY_SLUG[SLUG_OF[c]].title)}</button>`).join(" · ")}</p>` : ""}
    ${next ? `<button class="corner" type="button" data-go="${next.slug}" aria-label="${esc(t("turn_to", { title: next.title }))}"><span>${t("turn")}</span></button>` : ""}
    <nav class="folio" aria-label="${esc(t("turn_page_aria"))}">
      <button class="prev" type="button" ${prev ? `data-go="${prev.slug}"` : "disabled"}>&larr; ${prev ? esc(prev.title) : ""}</button>
      <span class="num">&mdash; ${p.index + 1} &mdash;</span>
      <button class="next" type="button" ${next ? `data-go="${next.slug}"` : "disabled"}>${next ? esc(next.title) : ""} &rarr;</button>
    </nav>`;

  if (done) {
    const right = $("page").querySelector(`.choice[data-i="${ex.answer}"]`);
    right.classList.add("right");
    $("page").querySelectorAll(".choice").forEach(b => b.disabled = true);
    $("verdict").className = "verdict yes";

let revealer;
function observeReveals() {
  const els = document.querySelectorAll(".landing .reveal:not(.in), .landing .step:not(.in), .landing .fleuron:not(.in)");
  if (!("IntersectionObserver" in window) || reducedMotion()) { els.forEach(el => el.classList.add("in")); return; }
  revealer = revealer || new IntersectionObserver(entries => entries.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); revealer.unobserve(e.target); }
  }), { threshold: .18 });
  els.forEach(el => revealer.observe(el));
}

function setupStage() {
  const motes = $("motes");
  motes.innerHTML = Array.from({ length: 18 }, (_, i) =>
    `<span class="mote" style="--x:${8 + (i * 47) % 84}%;--d:${7 + (i % 5) * 1.6}s;--dl:${-(i * 1.3)}s;--dx:${((i % 7) - 3) * 14}px"></span>`).join("");
  const stage = $("stage"), tilt = $("tilt");
  if (reducedMotion() || matchMedia("(hover: none)").matches) return;
  stage.addEventListener("pointermove", e => {
    const r = stage.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5;
    tilt.style.transform = `rotateY(${x * 22}deg) rotateX(${-y * 16}deg)`;
  });
  stage.addEventListener("pointerleave", () => { tilt.style.transform = ""; });
}

let actWatcher;
function renderStory() {
  const rm = BY_SLUG.rm;
  if (rm) { $("story-eraser").textContent = rm.title; $("story-eraser-m").textContent = rm.metaphor; }
  setStageCap($("story-visual").dataset.act);

    <div class="post-slip reveal" data-slug="${s}" style="--k:${k % 3};--r:${((k * 5) % 7) - 3}deg">
      <span class="post-stamp"></span>
      <code>$ ${esc(cmd)}</code>
      <div class="seal-pick" role="group" aria-label="${esc(t("seal_filter_aria"))}">${["low", "medium", "high"].map(r => `<button type="button" data-pick="${r}"><span class="mini-seal ${r}"></span>${esc(t("chip_" + r))}</button>`).join("")}</div>
      <p class="verdict-line"></p>
    </div>`).join("");
  if (!actWatcher) {
    actWatcher = true;
    let queued = false;
    const later = () => { if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; syncActs(); }); } };
    addEventListener("scroll", later, { passive: true });
    addEventListener("resize", later);
  }
  syncActs();
}

// The scene follows the card being read: the one whose middle is nearest the reading line.
// On phones the scene sits on top, so the reading line is lower, in the space under it.
function syncActs() {
  if ($("landing").hidden) return;
  const line = innerHeight * (matchMedia("(max-width: 900px)").matches ? .74 : .5);
  let best = null, gap = Infinity;
  document.querySelectorAll(".act").forEach(a => {
    const r = a.querySelector(".act-card").getBoundingClientRect();
    const d = Math.abs(r.top + r.height / 2 - line);
    if (d < gap) { gap = d; best = a; }
  });
  if (!best) return;
  const n = best.dataset.act;
  document.querySelectorAll(".act").forEach(a => a.classList.toggle("on", a === best));
  if ($("story-visual").dataset.act !== n) {
    const first = !$("story-visual").dataset.act;
    $("story-visual").dataset.act = n; setStageCap(n);
    if (!first) Sound.play({ 1: "slide", 2: "knock", 3: "scratch" }[n]);
  }
}

function setStageCap(n) { $("stage-act").textContent = `${t("act_word")} ${ROMAN[n]} · ${t("act" + n + "_t")}`; }

function pickSeal(btn) {
  const slip = btn.closest(".post-slip");
  if (slip.classList.contains("done")) return;
  const p = BY_SLUG[slip.dataset.slug];
  const first = !slip.dataset.tried;
  slip.dataset.tried = "1";
  if (btn.dataset.pick !== p.risk) {
    btn.classList.add("no"); btn.disabled = true;
    Sound.play("tock");
    slip.querySelector(".verdict-line").textContent = t("game_wrong");
    return;
  }
  btn.classList.add("yes");
  slip.classList.add("done");
  Sound.play("thud");
  if (!first) slip.classList.add("miss");
  slip.querySelector(".post-stamp").textContent = first ? t("game_stamp_ok") : t("game_stamp_late");
  slip.querySelector(".verdict-line").innerHTML = `${esc(SEALS[p.risk].note)} <button type="button" data-open="${p.slug}">${esc(p.title)} &rarr;</button>`;
  postScore.done++; if (first) postScore.right++;
  const total = document.querySelectorAll(".post-slip").length;
  if (postScore.done === total) {
    const n = postScore.right;
    const el = $("post-score");
    el.textContent = t(n === total ? "game_all" : n >= total - 2 ? "game_most" : "game_few", { n, total });
    el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  }
}

let finderHits = [], finderSel = 0, finderReturn = null;
function finderItems(q) {
  q = q.trim().toLowerCase();
  const pages = ORDER.map(p => ({ slug: p.slug, kind: "page", p }));
  const tales = BOOK.chapters.filter(ch => ch.tale).map(ch => ({ slug: taleSlug(ch.number), kind: "tale", ch }));
  if (!q) {
    const start = [];
    if (state.bookmark && SEQ.includes(state.bookmark)) start.push({ slug: state.bookmark, kind: "resume" });
    ["rm", "git-push", "sudo", "grep", "pipe"].forEach(s => BY_SLUG[s] && start.push(pages.find(x => x.slug === s)));
    return start.concat(tales.slice(0, 3));
  }
  const score = x => {
    if (x.kind === "tale") return x.ch.tale.title.toLowerCase().includes(q) || x.ch.title.toLowerCase().includes(q) ? 3 : 0;
    const c = x.p.command.toLowerCase(), ti = x.p.title.toLowerCase();
    if (c === q) return 10;
    if (c.startsWith(q)) return 8;
    if (c.includes(q)) return 6;
    if (ti.includes(q)) return 5;
    return plain(x.p.sections["In one line"]).toLowerCase().includes(q) || x.p.metaphor.toLowerCase().includes(q) ? 2 : 0;
  };
  return pages.concat(tales).map(x => [score(x), x]).filter(([s]) => s).sort((a, b) => b[0] - a[0]).slice(0, 14).map(([, x]) => x);
}

function renderFinder() {
  const q = $("finder-q").value;

  finderSel = Math.min(finderSel, Math.max(finderHits.length - 1, 0));
  const row = (x, i) => {
    const sel = i === finderSel ? "true" : "false";
    if (x.kind === "resume") return `<li><button type="button" role="option" aria-selected="${sel}" data-reach="${x.slug}"><span class="tale-mark">&#10148;</span><span class="ft">${esc(t("continue_at", { title: leafTitle(x.slug) }))}</span></button></li>`;
    if (x.kind === "tale") return `<li><button type="button" role="option" aria-selected="${sel}" data-reach="${x.slug}"><span class="tale-mark">&#10086;</span><span class="ft">${esc(x.ch.tale.title)}</span><span class="fl">${esc(t("chapter"))} ${ROMAN[x.ch.number]} · ${esc(x.ch.title)}</span></button></li>`;
    const p = x.p;
    return `<li><button type="button" role="option" aria-selected="${sel}" data-reach="${p.slug}"><span class="mini-seal ${p.risk}"></span><code>${esc(p.command)}</code><span class="ft">${esc(p.title)}</span><span class="fl">${esc(plain(p.sections["In one line"]))}</span></button></li>`;
  };
  $("finder-list").innerHTML = finderHits.length
    ? (q.trim() ? "" : `<li class="group">${esc(t("finder_suggest"))}</li>`) + finderHits.map(row).join("")
    : `<li class="finder-empty">${esc(t("count_none"))}</li>`;
  const cur = $("finder-list").querySelector('[aria-selected="true"]');
  if (cur) cur.scrollIntoView({ block: "nearest" });
}

function go(slug, opts = {}) {
  const summary = slug === "summary", tale = isTale(slug) && TALE_OF(slug);
  if (!isLeaf(slug)) slug = SEQ[0];
  const from = chapterOf(state.view);
  if (!summary) { state.bookmark = slug; save(); }
  state.view = slug;
  $("landing").hidden = true;
  document.body.classList.remove("on-landing");
  $("book").hidden = false;
  $("book").classList.remove("show-contents");
  renderTree(slug);
  if (summary) renderSummary(opts.animate !== false);
  else if (slug === "title") renderTitle(opts.animate !== false);
  else if (slug === "plan") renderPlan(opts.animate !== false, from);
  else if (isTale(slug)) renderTale(slug, opts.animate !== false);
  else renderPage(slug, opts.animate !== false);
  updateBookBar(slug);
  if (opts.animate !== false && opts.quiet !== true) Sound.play("turn");
  $("dock").classList.remove("show");
  if (location.hash.slice(1) !== slug) history.replaceState(null, "", "#" + slug);
  if (opts.scroll !== false) $("book").scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
}

  const cover = $("cover");

  cover.classList.add("opening");
  Sound.play("creak");
  setTimeout(() => { cover.classList.remove("opening"); go(target); }, 650);
}

  const i = Number(btn.dataset.i);
  const verdict = $("verdict");
  if (i !== ex.answer) {
    btn.classList.add("wrong", "shake"); btn.disabled = true;

  }
  btn.classList.add("right", "inked");
  Sound.play("scratch");
  $("page").querySelectorAll(".choice").forEach(b => b.disabled = true);
  verdict.className = "verdict yes";
  verdict.textContent = ex.explanation;
  if (!state.stamps.includes(slug)) {
    state.stamps.push(slug); save();
    Sound.play("thud");
    const stamp = document.createElement("div");
    stamp.className = "stamp fresh";
    stamp.innerHTML = `${esc(t("understood"))}<br>&#10022;`;
    $("exercise").appendChild(stamp);

    if (sealed) setTimeout(() => Sound.play("chime"), 400);

    updateBookBar(slug);

}

  if (b.dataset.story) {
    const desk = $("choice-desk");
    desk.classList.remove("signed", "looked");
    if (b.dataset.story !== "rewind") { void desk.offsetWidth; desk.classList.add(b.dataset.story === "sign" ? "signed" : "looked"); }
    if (b.dataset.story === "sign") { Sound.play("scratch"); setTimeout(() => Sound.play("thud"), 650); } else Sound.play("slide");
    return;
  }
  if (b.hasAttribute("data-sound")) return Sound.toggle();
  if (b.dataset.floor) return setFloor(b.dataset.floor);
  if (b.hasAttribute("data-finder")) { Sound.play("drawer"); return openFinder(); }
  if (b.hasAttribute("data-reach")) return chooseFinder(b.dataset.reach);
  if (b.dataset.open) return openBook(b.dataset.open === "first" ? SEQ[0] : b.dataset.open === "resume" ? resumeSlug() : b.dataset.open);
  if (b.dataset.lang) {
    useLang(b.dataset.lang); save(); liveDetails(); Sound.sync();
    if ($("book").hidden) return renderCover();
    renderCover();
    return go(state.view || SEQ[0], { scroll: false });
  }
  if (b.classList.contains("choice")) return answer(b);
  if (b.dataset.ch) {
    const opening = b.getAttribute("aria-expanded") !== "true";
    state.toggled = { ...state.toggled, [b.dataset.ch]: opening };
    unfolding = opening ? Number(b.dataset.ch) : null;
    save(); renderTree(state.view); unfolding = null;
    return;
  }
  if (b.dataset.risk) {
    state.sumRisk = b.dataset.risk;
    document.querySelectorAll(".chips button").forEach(c => c.setAttribute("aria-pressed", String(c === b)));
    return fillSummary();
  }
  switch (b.id) {
    case "open-book": return openBook(SEQ[0]);
    case "open-summary": return openBook("summary");
    case "continue": return openBook(state.bookmark);
    case "close-book": case "to-study": return showLanding();
    case "open-contents": $("book").classList.add("show-contents"); $("book").scrollIntoView({ block: "start" }); return;
    case "close-contents": $("book").classList.remove("show-contents"); return;
  }
});
// The cover itself opens the book, at the ribbon if there is one.
const openFromCover = () => openBook(state.bookmark && SEQ.includes(state.bookmark) ? state.bookmark : SEQ[0]);
$("cover").addEventListener("click", openFromCover);
$("cover").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openFromCover(); } });
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-scroll]");
  if (!a) return;
  e.preventDefault();
  $(a.dataset.scroll).scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
});
document.addEventListener("click", e => {
  const row = !e.target.closest("button") && e.target.closest("tr[data-row]");
  if (row) go(row.dataset.row);
});
document.addEventListener("click", e => { if (e.target.closest("[data-close-finder]")) closeFinder(); });
addEventListener("scroll", onScroll, { passive: true });
document.addEventListener("keydown", e => {
  const typing = e.target.closest("input, textarea");
  if (!$("finder").hidden) {
    e.stopImmediatePropagation();
    if (e.key === "Escape") { e.preventDefault(); return closeFinder(); }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      finderSel = (finderSel + (e.key === "ArrowDown" ? 1 : -1) + finderHits.length) % Math.max(finderHits.length, 1);
      return renderFinder();
    }
    if (e.key === "Enter" && finderHits[finderSel]) { e.preventDefault(); return chooseFinder(finderHits[finderSel].slug); }
    if (e.key === "Tab") { e.preventDefault(); $("finder-q").focus(); }
    return;
  }
  if ((e.key === "/" && !typing) || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k")) { e.preventDefault(); openFinder(); }
}, true);
document.addEventListener("input", e => {
  if (e.target.id === "finder-q") { finderSel = 0; return renderFinder(); }
  if (e.target.id === "reader-name") { state.reader = e.target.value.trim(); save(); return; }
  if (e.target.id !== "sum-q") return;
  state.sumQuery = e.target.value;
  fillSummary();
});
document.addEventListener("keydown", e => {
  if ($("book").hidden || state.view === "summary" || e.target.closest("input, textarea")) return;
  const [prev, next] = neighbours(state.view);
  if (e.key === "ArrowRight" && next) go(next);
  if (e.key === "ArrowLeft" && prev) go(prev);
});

window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h !== state.view && isLeaf(h)) go(h);
});
useLang(pickLang());
liveDetails(); setInterval(liveDetails, 60000);
Sound.sync();
document.body.classList.add("on-landing");
setupStage();
renderCover();
const start = location.hash.slice(1);
if (isLeaf(start)) go(start, { animate: false, scroll: false });
</script>
