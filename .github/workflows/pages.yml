# Builds the book and publishes it on GitHub Pages every time main changes.
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish the book

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push replaces a waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the build tools
        run: pip install -r requirements.txt

      - name: Check every page against the house rules
        run: python3 tools/check_pages.py

      - name: Bind the book
        run: python3 tools/build_site.py

      - name: Prepare the site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    # Pull requests are checked and built, but only main is published.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
