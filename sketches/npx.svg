<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<pattern id="npx-h1" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3" stroke="currentColor" stroke-width=".45"/></pattern>
<pattern id="npx-h2" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v2.2" stroke="currentColor" stroke-width=".6"/></pattern>
<pattern id="npx-x" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0v2.4M0 0h2.4" stroke="currentColor" stroke-width=".5"/></pattern>
<pattern id="npx-g" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3M0 0h3" stroke="currentColor" stroke-width=".4"/></pattern>
<pattern id="npx-wood" width="5" height="40" patternUnits="userSpaceOnUse"><path d="M1 0q1.5 10 0 20t0 20M3.5 0q-1 12 0 24t0 16" stroke="currentColor" stroke-width=".3" fill="none"/></pattern>
</defs>
<path d="M0 154H200" stroke-width=".6"/>
<ellipse cx="96" cy="150" rx="76" ry="4" fill="url(#npx-x)" stroke="none"/>
<!-- doorstep threshold -->
<path d="M20 138h160v6H20z" class="bg" fill="#f4ecd8" stroke-width="1"/><path d="M20 141h160" stroke-width=".3"/>
<!-- open sample case, lid up -->
<g transform="translate(0 10)"><!-- lid with catalogue tucked in -->
<g transform="rotate(-8 60 70)">
<path d="M34 46h56v52H34z" class="bg" fill="#f4ecd8" stroke-width="1.4"/><path d="M34 46h56v52H34z" fill="url(#npx-wood)" stroke="none"/>
<path d="M38 50h48v44H38z" stroke-width=".5"/>
<!-- catalogue pages -->
<path d="M44 54h36v34H44z" class="bg" fill="#f4ecd8" stroke-width="1.1"/>
<path d="M48 60h28M48 66h28M48 72h20M48 78h28" stroke-width=".6"/>
<path d="M62 54v34" stroke-width=".4"/>
</g>
<!-- case body (open, lower half) -->
<path d="M44 98h84v30H44z" class="bg" fill="#f4ecd8" stroke-width="1.5"/><path d="M44 98h84v30H44z" fill="url(#npx-g)" stroke="none"/>
<path d="M48 102h76v22H48z" class="bg" fill="#f4ecd8" stroke-width=".8"/>
<!-- compartments -->
<path d="M72 102v22M96 102v22M110 102v22" stroke-width=".5"/>
<!-- brass clasp and handle -->
<path d="M80 98v-5h12v5" class="bg" fill="#f4ecd8" stroke-width="1"/>
<path d="M84 93q2-4 4 0" stroke-width="1.6"/>
</g>
<!-- one tool lifted out mid-demonstration -->
<g class="anim-bob">
<path d="M138 70l10 2 2 30-7 4-7-4z" class="bg" fill="#f4ecd8" stroke-width="1.3"/>
<path d="M140 76l8 1M140 84l8 1" stroke-width=".6"/>
<path d="M143 72v-8h4v8" class="bg" fill="#f4ecd8" stroke-width="1"/>
<circle cx="145" cy="62" r="3" class="bg" fill="#f4ecd8" stroke-width="1.1"/>
<circle cx="145" cy="62" r="3" fill="url(#npx-h1)" stroke="none"/>
</g>
</svg>
