<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<pattern id="base64-h1" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3" stroke="currentColor" stroke-width=".45"/></pattern>
<pattern id="base64-h2" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v2.2" stroke="currentColor" stroke-width=".6"/></pattern>
<pattern id="base64-x" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0v2.4M0 0h2.4" stroke="currentColor" stroke-width=".5"/></pattern>
<pattern id="base64-g" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3M0 0h3" stroke="currentColor" stroke-width=".4"/></pattern>
</defs>
<path d="M0 154H200" stroke-width=".6"/>
<ellipse cx="100" cy="150" rx="72" ry="4" fill="url(#base64-x)" stroke="none"/>
<!-- the stand the disc turns on -->
<path d="M96 120v18h8v-18" class="bg" fill="#f4ecd8" stroke-width="1.2"/><path d="M70 138h60l4 12H66z" class="bg" fill="#f4ecd8" stroke-width="1.3"/><path d="M100 138h30l4 12h-34z" fill="url(#base64-h1)" stroke="none"/>
<!-- strip of plain writing feeding in from the left -->
<path d="M8 74h40v16H8z" class="bg" fill="#f4ecd8" stroke-width="1.1"/>
<path d="M12 79h30M12 84h24" stroke-width=".7"/>
<path d="M48 82h12" stroke-width=".7" stroke-dasharray="2 2"/>
<!-- the cipher disc: two concentric lettered rings -->
<circle cx="100" cy="82" r="42" class="bg" fill="#f4ecd8" stroke-width="1.6"/>
<circle cx="100" cy="82" r="42" fill="url(#base64-h1)" stroke="none"/>
<circle cx="100" cy="82" r="34" class="bg" fill="#f4ecd8" stroke-width="1.1"/>
<circle cx="100" cy="82" r="26" class="bg" fill="#f4ecd8" stroke-width="1"/>
<circle cx="100" cy="82" r="26" fill="url(#base64-g)" stroke="none"/>
<circle cx="100" cy="82" r="18" class="bg" fill="#f4ecd8" stroke-width="1"/>
<!-- tick marks around the outer ring -->
<g class="anim-spin">
<path d="M100 44v8M100 112v8M62 82h8M130 82h8" stroke-width=".8"/>
<path d="M73 55l6 6M127 55l-6 6M73 109l6-6M127 109l-6-6" stroke-width=".6"/>
<!-- central knob -->
<circle cx="100" cy="82" r="5" class="bg" fill="#f4ecd8" stroke-width="1.2"/>
<circle cx="100" cy="82" r="5" fill="url(#base64-h2)" stroke="none"/>
<path d="M100 70v-8" stroke-width="1.4"/>
</g>
<!-- strip of jumbled characters coming out the right -->
<path d="M152 74h40v16h-40z" class="bg" fill="#f4ecd8" stroke-width="1.1"/>
<path d="M156 79l3 3-3 3M162 79v6M166 82h4M173 79l3 6M184 79l-2 6" stroke-width=".7"/>
<path d="M140 82h12" stroke-width=".7" stroke-dasharray="2 2"/>
</svg>
