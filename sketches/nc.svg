<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<pattern id="nc-h1" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3" stroke="currentColor" stroke-width=".45"/></pattern>
<pattern id="nc-h2" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v2.2" stroke="currentColor" stroke-width=".6"/></pattern>
<pattern id="nc-x" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0v2.4M0 0h2.4" stroke="currentColor" stroke-width=".5"/></pattern>
<pattern id="nc-g" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3M0 0h3" stroke="currentColor" stroke-width=".4"/></pattern>
<pattern id="nc-panel" width="18" height="6" patternUnits="userSpaceOnUse"><path d="M0 3h18" stroke="currentColor" stroke-width=".3"/></pattern>
</defs>
<path d="M0 154H200" stroke-width=".6"/>
<ellipse cx="96" cy="150" rx="70" ry="4" fill="url(#nc-x)" stroke="none"/>
<!-- panelled wall -->
<path d="M24 20h152v128H24z" class="bg" fill="#f4ecd8" stroke-width="1.3"/>
<path d="M24 20h152v128H24z" fill="url(#nc-panel)" stroke="none"/>
<!-- wall panel seams -->
<path d="M32 28h64v44H32zM104 28h64v44h-64zM32 84h64v56H32zM104 84h64v56h-64z" stroke-width=".6"/>
<!-- the brass-rimmed hatch, set in the wall, door ajar -->
<circle cx="100" cy="74" r="30" class="bg" fill="#f4ecd8" stroke-width="1.7"/>
<circle cx="100" cy="74" r="30" fill="url(#nc-h1)" stroke="none"/>
<circle cx="100" cy="74" r="24" class="bg" fill="#f4ecd8" stroke-width="1.2"/>
<!-- rivets around the brass rim -->
<g>
<circle cx="100" cy="47" r="1.3" fill="currentColor"/><circle cx="100" cy="101" r="1.3" fill="currentColor"/>
<circle cx="73" cy="74" r="1.3" fill="currentColor"/><circle cx="127" cy="74" r="1.3" fill="currentColor"/>
<circle cx="81" cy="55" r="1.3" fill="currentColor"/><circle cx="119" cy="55" r="1.3" fill="currentColor"/>
<circle cx="81" cy="93" r="1.3" fill="currentColor"/><circle cx="119" cy="93" r="1.3" fill="currentColor"/>
</g>
<!-- the little door, swung open on a hinge -->
<g class="anim-swing" transform-origin="76 74">
<path d="M76 50a24 24 0 0 0 0 48l6-4a18 18 0 0 1 0-40z" class="bg" fill="#f4ecd8" stroke-width="1.3"/>
<path d="M76 50a24 24 0 0 0 0 48l6-4a18 18 0 0 1 0-40z" fill="url(#nc-g)" stroke="none"/>
<circle cx="79" cy="74" r="2" class="bg" fill="#f4ecd8" stroke-width="1"/>
</g>
<!-- dark opening behind the door -->
<path d="M100 74m-14 0a14 14 0 0 1 28 0a14 14 0 0 1 -28 0" fill="url(#nc-h2)" stroke="none"/>
<circle cx="100" cy="74" r="14" stroke-width=".8"/>
<!-- speaking-tube cord running from the hatch off the frame -->
<path d="M114 74q22 6 30 24t26 24" stroke-width="2.4"/>
<path d="M114 74q22 6 30 24t26 24" stroke-width=".7" class="bgs" stroke="#f4ecd8"/>
<!-- tube mouthpiece at the bottom corner -->
<path d="M166 120l14 4-2 10-14-4z" class="bg" fill="#f4ecd8" stroke-width="1.3"/>
<path d="M166 120l14 4-2 10-14-4z" fill="url(#nc-h1)" stroke="none"/>
</svg>
