<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><defs>
<pattern id="eval-h1" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3" stroke="currentColor" stroke-width=".45"/></pattern>
<pattern id="eval-h2" width="2.2" height="2.2" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v2.2" stroke="currentColor" stroke-width=".6"/></pattern>
<pattern id="eval-x" width="2.4" height="2.4" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><path d="M0 0v2.4M0 0h2.4" stroke="currentColor" stroke-width=".5"/></pattern>
<pattern id="eval-g" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v3M0 0h3" stroke="currentColor" stroke-width=".4"/></pattern>
</defs>
<path d="M0 154H200" stroke-width=".6"/>
<ellipse cx="96" cy="150" rx="80" ry="4" fill="url(#eval-x)" stroke="none"/>
<!-- a writing table under the scraps -->
<path d="M22 112v38M178 112v38" stroke-width="2.2"/><path d="M12 106h176v7H12z" class="bg" fill="#f4ecd8" stroke-width="1.3"/><path d="M12 110h176" stroke-width=".3"/>
<!-- three torn scraps laid in a row forming one line -->
<!-- scrap 1 -->
<path d="M24 60l40-6 4 40-42 5z" class="bg" fill="#f4ecd8" stroke-width="1.3"/>
<path d="M30 70l30-4M30 78l28-4M30 86l20-3" stroke-width=".7"/>
<path d="M64 54l4 40" stroke-width=".5" stroke-dasharray="2 2"/>
<!-- scrap 2 (middle, torn both sides) -->
<path d="M70 56l42-4 3 42-44 4z" class="bg" fill="#f4ecd8" stroke-width="1.3"/>
<path d="M76 66l30-3M76 74l30-3M76 82l24-2M76 90l18-2" stroke-width=".7"/>
<path d="M70 56l3 42M112 52l3 42" stroke-width=".5" stroke-dasharray="2 2"/>
<!-- scrap 3 -->
<path d="M118 54l42-6 4 42-43 6z" class="bg" fill="#f4ecd8" stroke-width="1.3"/>
<path d="M124 66l30-4M124 74l28-4M124 82l20-3" stroke-width=".7"/>
<path d="M118 54l4 42" stroke-width=".5" stroke-dasharray="2 2"/>
<!-- the one joined line of writing running across all three -->
<path d="M30 100q66-6 134-8" stroke-width="1"/>
<!-- pen poised above, about to sign -->
<g class="anim-write" transform="rotate(38 150 36)">
<path d="M148 20h5l2 60-4.5 10-4.5-10z" class="bg" fill="#f4ecd8" stroke-width="1.2"/>
<path d="M150.5 20v70" stroke-width=".4"/>
<path d="M150.5 90l-4.5-10h9z" fill="url(#eval-h2)" stroke="none"/>
<path d="M148 34h5" stroke-width=".8"/>
</g>
</svg>
